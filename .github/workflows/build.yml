name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3 python3-pip openjdk-17-jdk zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev libtool autoconf automake libltdl-dev
          # Устанавливаем стабильные версии
          pip install buildozer "cython<3.0" "python-for-android==2024.1.21"
          
      - name: Build with Buildozer
        run: |
          rm -rf .buildozer
          buildozer -v android debug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: library-scanner-apk
          path: bin/*.apk
